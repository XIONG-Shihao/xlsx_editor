[package]
name = "workbook-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rusqlite = { version = "0.37", features = ["bundled", "backup", "hooks", "collation"] }
sha2 = "0.10"
zip = { version = "7.2", default-features = false, features = ["deflate"] }
quick-xml = "=0.37.5"
num-bigint = "=0.4.8"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
icu_collator = "=2.2.1"

[dev-dependencies]
tempfile = "3"
